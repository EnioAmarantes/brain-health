services:
  api:
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    restart: unless-stopped

  frontend:
    pull_policy: always
    restart: unless-stopped

  db:
    restart: unless-stopped

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD deve ser definida}
